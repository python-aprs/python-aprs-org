<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}python-aprs{% endblock %}</title>
  <meta name="description" content="Async Python libraries for APRS, AX.25 and KISS.">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site">
    <a class="brand" href="/"><img src="/logo.svg" alt="" width="28" height="28"> python-aprs</a>
    <nav>
      <a href="/"{% if page == "index.html" %} aria-current="page"{% endif %}>Overview</a>
      <a href="/docs/">API docs</a>
      <a href="/changelog.html"{% if page == "changelog.html" %} aria-current="page"{% endif %}>Changelog</a>
      <a href="https://github.com/python-aprs">GitHub</a>
    </nav>
  </header>
  <main>
{% block main %}{% endblock %}
  </main>
  <footer class="site">
    <p>python-aprs libraries are Apache-2.0 licensed. APRS is a registered trademark of APRS Software and Bob Bruninga, WB4APR.</p>
    <p>Built {{ built.strftime("%Y-%m-%d %H:%M UTC") }} from <a href="https://github.com/python-aprs/python-aprs-org">python-aprs-org</a>.</p>
  </footer>
</body>
</html>
